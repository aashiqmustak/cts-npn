services:

  backend:
    build:
      context: ./
      dockerfile: infra/docker/backend.Dockerfile
    container_name: cts-pharmaassist-backend-prod
    restart: always
    env_file:
      - .env
    volumes:
      - ./server:/app/server
      - ./main.py:/app/main.py
      - ./dataset:/app/dataset
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  frontend:
    build:
      context: ./
      dockerfile: infra/docker/frontend.Dockerfile
    container_name: cts-pharmaassist-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
