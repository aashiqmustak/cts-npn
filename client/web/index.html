<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="client">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>client</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Sans Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,700&family=Google+Sans+Text:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,700&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    body, html, * {
      font-family: 'Google Sans', 'Google Sans Text', 'Product Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }
  </style>
</head>
<body>
  <script>
    let recognition = null;
    let isRecognizing = false;

    window.startSpeechRecognition = function(callbackName, endCallbackName) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        console.warn("Speech recognition not supported in this browser.");
        return false;
      }
      
      try {
        if (recognition && isRecognizing) {
          recognition.stop();
        }

        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onstart = function() {
          isRecognizing = true;
          console.log("[STT] Speech recognition active...");
        };

        recognition.onresult = function(event) {
          let transcript = '';
          for (let i = 0; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
          }
          console.log("[STT Heard]:", transcript);
          if (window[callbackName]) {
            window[callbackName](transcript);
          }
        };

        recognition.onerror = function(event) {
          console.error("[STT Error]:", event.error);
        };

        recognition.onend = function() {
          isRecognizing = false;
          console.log("[STT] Speech recognition ended");
          if (window[endCallbackName]) {
            window[endCallbackName]();
          }
        };

        recognition.start();
        return true;
      } catch (err) {
        console.error("Failed to start speech recognition:", err);
        return false;
      }
    };

    window.stopSpeechRecognition = function() {
      if (recognition && isRecognizing) {
        recognition.stop();
        isRecognizing = false;
      }
    };

    window.playBase64Audio = function(base64Wav) {
      if (!base64Wav) return;
      try {
        const audio = new Audio("data:audio/wav;base64," + base64Wav);
        audio.play().catch(e => console.warn("Autoplay prevented:", e));
      } catch (e) {
        console.error("Failed to play base64 audio:", e);
      }
    };

    window.speakTextWithBrowserTTS = function(text) {
      if (!window.speechSynthesis) return;
      try {
        window.speechSynthesis.cancel();
        const clean = text.replace(/[*_#•]/g, '').trim();
        const utterance = new SpeechSynthesisUtterance(clean);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.error("Browser TTS error:", e);
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
