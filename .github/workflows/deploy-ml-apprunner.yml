name: Deploy ML Models to AWS App Runner

on:
  push:
    branches: [ "main" ]
    paths:
      - "ml-model/**"
      - "server/src/ml_service/**"
      - "infra/docker/ml.Dockerfile"
      - ".github/workflows/deploy-ml-apprunner.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build ECR Image & Deploy to App Runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: cts-npn-ml
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build container
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f infra/docker/ml.Dockerfile .
          
          # Push both sha tag and latest tag
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Trigger App Runner Deployment (if service exists)
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          SERVICE_NAME: cts-npn-ml-service
        run: |
          SERVICE_ARN=$(aws apprunner list-services --region $AWS_REGION --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME'].ServiceArn" --output text || true)
          if [ -n "$SERVICE_ARN" ] && [ "$SERVICE_ARN" != "None" ]; then
            echo "Starting App Runner deployment for $SERVICE_ARN..."
            aws apprunner start-deployment --service-arn $SERVICE_ARN --region $AWS_REGION
          else
            echo "App Runner service '$SERVICE_NAME' not found or auto-deployment is enabled via ECR."
          fi
